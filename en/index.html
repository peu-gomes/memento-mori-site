    function dataNascimento(op) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(op.nascimento || "")) return null;
      const d = lerData(op.nascimento);
      return isNaN(d) || d.getFullYear() < ANO_MIN ? null : d;
    }

    // Idade completa e semanas desde o último aniversário: cada linha da grade começa num aniversário
    // (assim a grade não "escorrega": 52 semanas são 364 dias, e o ano tem 365 ou 366)
    function posicaoNaVida(nasc, hoje) {
      const aniversario = (a) => new Date(nasc.getFullYear() + a, nasc.getMonth(), nasc.getDate());
      let anos = hoje.getFullYear() - nasc.getFullYear();
      if (aniversario(anos) > hoje) anos--;
      const dias = Math.round((hoje - aniversario(anos)) / DIA_MS);
      return { anos, semana: Math.min(SEMANAS_ANO - 1, Math.floor(dias / 7)) };
    }

    // Contagem real de semanas (de 7 em 7 dias) para o resumo: vividas e total até a expectativa
    function contagem(op) {
      const nasc = lerData(op.nascimento), hoje = hojeLocal();
      const fim = new Date(nasc.getFullYear() + op.anos, nasc.getMonth(), nasc.getDate());
      const semanas = (a, b) => Math.floor(Math.round((b - a) / DIA_MS) / 7);
      const total = semanas(nasc, fim);
      const vividas = Math.min(Math.max(semanas(nasc, hoje), 0), total);
      return { vividas, total, restantes: total - vividas, passou: hoje >= fim };
    }

    // A data é obrigatória quando a grade usa o "hoje" ou o calendário
    const precisaDaData = (op) => op.preencher || op.atual || op.linhasPor === "civil";

    function hexParaRgb(hex) {
      const n = parseInt(hex.slice(1), 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    // ---------- Opções (lidas da tela) ----------
    function lerOpcoes() {
      return {
        idioma,
        nascimento: $("nascimento").value,
        anos: Number($("expectativa").value),
        corVividas: $("corVividas").value,
        corAtual: $("corAtual").value,
        preencher: $("preencher").checked,
        atual: $("atual").checked,
        legenda: $("legenda").checked,
        rotulos: $("rotulos").checked,
        formato: $("formato-circulo").checked ? "circulo" : "quadrado",
        linhasPor: valorMarcado("linhasPor", "vida"),
        papel: valorMarcado("papel", "a4"),
        primeiroDia: primeiroDiaDaSemana(),
        divAnos: valorMarcado("divAnos", "10"),
        divSemanas: valorMarcado("divSemanas", "meses"),
        numerar: $("numerar").checked,
        contorno: valorMarcado("contorno", "claro"),
        textos
      };
    }

    function valorMarcado(nome, padrao) {
      const marcado = document.querySelector(`input[name="${nome}"]:checked`);
      return marcado ? marcado.value : padrao;
    }

    function validar(op, t) {
      if (!precisaDaData(op)) {
        // Sem preenchimento, sem destaque e por ano de vida, a data de nascimento não é obrigatória
        if (!Number.isInteger(op.anos) || op.anos < 1 || op.anos > 120) return t.erroExpectativa;
        return null;
      }
      if (!op.nascimento) return t.erroNascimento;
      // Ano com mais de 4 dígitos (o campo nativo permite digitar até 6) ou antes de 1900
      if (!/^\d{4}-\d{2}-\d{2}$/.test(op.nascimento) || Number(op.nascimento.slice(0, 4)) < ANO_MIN) return t.erroNascimento;
      const nasc = lerData(op.nascimento);
      if (isNaN(nasc) || nasc > new Date()) return t.erroNascimento;
      if (!Number.isInteger(op.anos) || op.anos < 1 || op.anos > 120) return t.erroExpectativa;
      return null;
    }

    // ---------- Modelo da grade ----------
    // Decide o que vai em cada linha e coluna, sem medidas: as células (vivida, atual ou restante),
    // os espaços entre grupos e os rótulos. O layout depois transforma isso em desenho.

    // Meses de verdade dentro de um ano de vida (que começa no aniversário): grupos de semanas
    // seguidas do mesmo mês. Cada semana conta para o mês que tem a maior parte dos seus dias.
    // A conta é feita num ano sem 29 de fevereiro, para ficar igual em todas as linhas.
    function mesesDoAnoDeVida(nasc) {
      const inicio = new Date(2025, nasc.getMonth(), nasc.getDate());
      const grupos = [];
      for (let w = 0; w < SEMANAS_ANO; w++) {
        const mes = somarDias(inicio, 7 * w + 3).getMonth();
        const ultimo = grupos[grupos.length - 1];
        if (ultimo && ultimo.mes === mes) ultimo.fim = w;
        else grupos.push({ mes, ini: w, fim: w });
      }
      return grupos;
    }

    // Cada linha é um ano de vida: começa no aniversário e tem 52 semanas
    function gradeAnoDeVida(op, t) {
      const linhas = op.anos, colunas = SEMANAS_ANO, total = linhas * colunas;
      const nasc = dataNascimento(op);
      // Posição da semana atual (linha × 52 + coluna); sem preenchimento nem destaque, a grade fica em branco
      let atual = -1;
      if ((op.preencher || op.atual) && nasc) {
        const p = posicaoNaVida(nasc, hojeLocal());
        atual = Math.min(p.anos * colunas + p.semana, total);
      }
      const celulas = [];
      for (let i = 0; i < total; i++) {
        const tipo = op.preencher && i < atual ? "vivida" : op.atual && i === atual ? "atual" : "restante";
        celulas.push({ linha: Math.floor(i / colunas), coluna: i % colunas, tipo });
      }

      // Semanas: meses de verdade a partir do aniversário (precisa da data), trimestres de 13 semanas ou nada
      const meses = op.divSemanas === "meses" && nasc ? mesesDoAnoDeVida(nasc) : null;
      let espacoColuna = espacoSemanas(op.divSemanas); // sem a data, "meses" fica em grupos aproximados
      let topo = [];
      if (meses) {
        const inicios = new Map(meses.slice(1).map((m) => [m.ini, m.mes]));
        // Espaço maior antes de janeiro, abril, julho e outubro (os trimestres do calendário)
        espacoColuna = (k) => (!inicios.has(k) ? 0 : inicios.get(k) % 3 === 0 ? ESPACO_MAIOR : ESPACO_MENOR);
        if (op.numerar) {
          topo = meses.map((m) => ({ coluna: m.ini, n: m.fim - m.ini + 1, textos: [t.mesesCurtos[m.mes], t.mesesCurtos[m.mes][0]] }));
        }
      } else if (op.numerar) {
        topo = inicioGrupos(op.divSemanas).map((coluna) => ({ coluna, n: 1, textos: [String(coluna + 1)], numero: true }));
      }

      const cada = op.divAnos === "5" ? 5 : 10;
      const esquerda = [];
      if (op.rotulos) for (let l = 0; l < linhas; l += cada) esquerda.push({ linha: l, s: String(l) });
      return {
        linhas, colunas, celulas, topo, esquerda, direita: [],
        espacoLinha: espacoAnos(op.divAnos), espacoColuna,
        tituloTopo: op.numerar && !meses ? t.pdfSemana : null,
        tituloEsquerda: op.rotulos ? t.pdfIdade : null,
        tituloDireita: null
      };
    }

    // Cada linha é um ano do calendário (janeiro a dezembro), com um bloco de 5 posições por mês.
    // As semanas começam no domingo ou na segunda (conforme o costume do lugar) e contam para o mês
    // (e o ano) do seu 4º dia, onde está a maior parte delas; então cada mês tem 4 ou 5 semanas,
    // como numa folhinha, e a 5ª posição fica vazia nos meses de 4.
    const POSICOES_MES = 5;
    function gradeAnoCivil(op, t) {
      const nasc = dataNascimento(op);
      const fim = new Date(nasc.getFullYear() + op.anos, nasc.getMonth(), nasc.getDate());
      const semanaDe = (d) => inicioDaSemana(d, op.primeiroDia);
      const primeira = semanaDe(nasc), ultima = semanaDe(fim), deHoje = semanaDe(hojeLocal());
      const ano0 = somarDias(primeira, 3).getFullYear();
      const linhas = somarDias(ultima, 3).getFullYear() - ano0 + 1;
      const celulas = [];
      for (let s = primeira; s <= ultima; s = somarDias(s, 7)) {
        const quarta = somarDias(s, 3);
        const vivida = op.preencher && s < deHoje;
        const atual = op.atual && s.getTime() === deHoje.getTime();
        celulas.push({
          linha: quarta.getFullYear() - ano0,
          coluna: quarta.getMonth() * POSICOES_MES + Math.floor((quarta.getDate() - 1) / 7),
          tipo: vivida ? "vivida" : atual ? "atual" : "restante"
        });
      }

      // Espaço entre os meses (maior entre trimestres) e entre grupos de anos do calendário
      const espacoColuna = (k) => (k % POSICOES_MES ? 0 : k % (3 * POSICOES_MES) ? ESPACO_MENOR : ESPACO_MAIOR);
      const espacoLinha = (k) => {
        const ano = ano0 + k; // o ano que começa depois do espaço
        if (op.divAnos === "0") return 0;
        if (ano % 10 === 0) return ESPACO_MAIOR;
        return op.divAnos === "5" && ano % 5 === 0 ? ESPACO_MENOR : 0;
      };
      const topo = op.numerar
        ? t.mesesCurtos.map((m, i) => ({ coluna: i * POSICOES_MES, n: POSICOES_MES, textos: [m, m[0]] }))
        : [];

      // Laterais: o ano à esquerda e, à direita, a idade que se completa naquele ano.
      // Cada lado marca os seus próprios números redondos (anos 2005, 2010...; idades 0, 5, 10...)
      const esquerda = [], direita = [];
      if (op.rotulos) {
        const cada = op.divAnos === "5" ? 5 : 10;
        for (let l = 0; l < linhas; l++) {
          const ano = ano0 + l;
          const idade = ano - nasc.getFullYear();
          const primeiraLinha = l === 0 && cada - (ano % cada) >= 3; // o ano de nascimento, se não colar no próximo
          if (ano % cada === 0 || primeiraLinha) esquerda.push({ linha: l, s: String(ano) });
          if (idade >= 0 && idade % cada === 0) direita.push({ linha: l, s: String(idade) });
        }
      }
      return {
        linhas, colunas: 12 * POSICOES_MES, celulas, topo, esquerda, direita,
        espacoLinha, espacoColuna,
        tituloTopo: null,
        tituloEsquerda: op.rotulos ? t.pdfAno : null,
        tituloDireita: op.rotulos ? t.pdfIdade : null
      };
    }

    // ---------- Layout ----------
    // Gera uma lista de desenhos em milímetros (página A4).
    // Usada tanto pela prévia (canvas) quanto pelo PDF: o que você vê é o que sai.
    function layout(op, t) {
      const { w: W, h: H } = PAPEIS[op.papel] || PAPEIS.a4;
      // O que vai em cada linha e coluna: por ano de vida (o clássico) ou por ano do calendário
      const g = op.linhasPor === "civil" ? gradeAnoCivil(op, t) : gradeAnoDeVida(op, t);
      const c = [];
      c.info = { celulas: g.celulas.length };

      // Fundo branco
      c.push({ t: "rect", x: 0, y: 0, w: W, h: H, fill: "#ffffff" });

      // Textos do topo e do rodapé, organizados em linhas: cada posição empilha os seus,
      // e um texto que encostaria em outro da mesma linha desce para a seguinte
      const GAP = 1.5, MARGEM_TOPO = 12, MARGEM_BASE = 10, FOLGA = 4;
      const blocos = blocosVisiveis(op.textos);
      const lado = (b) => b.pos.split("-")[1];
      const montarLinhas = (lista, xEsq, xDir) => {
        const linhas = [];
        const ultima = {};
        lista.forEach((b) => {
          const l = lado(b);
          const x = l === "esq" ? xEsq : l === "dir" ? xDir - b.largura : W / 2 - b.largura / 2;
          const ini = x - FOLGA / 2, fim = x + b.largura + FOLGA / 2;
          let k = (ultima[l] === undefined ? -1 : ultima[l]) + 1;
          while (k < linhas.length && linhas[k].itens.some((o) => ini < o.fim && o.ini < fim)) k++;
          if (k === linhas.length) linhas.push({ itens: [], altura: 0 });
          linhas[k].itens.push({ b, x, ini, fim });
          linhas[k].altura = Math.max(linhas[k].altura, b.altura);
          ultima[l] = k;
        });
        return linhas;
      };
      const alturaLinhas = (linhas) => linhas.reduce((soma, ln, i) => soma + ln.altura + (i ? GAP : 0), 0);
      const doTopo = blocos.filter((b) => b.pos.startsWith("topo"));
      const doRodape = blocos.filter((b) => b.pos.startsWith("rodape"));

      // Espaços das divisões, medidos em "passos" da grade (um passo = uma semana com o seu respiro)
      const desY = deslocamentos(g.linhas, g.espacoLinha);
      const desX = deslocamentos(g.colunas, g.espacoColuna);
      const extraY = desY[g.linhas - 1], extraX = desX[g.colunas - 1];
      const temCabecalho = g.topo.length || g.tituloEsquerda || g.tituloDireita;

      // Grade: ocupa o espaço que os textos deixam. Como os textos dos lados se alinham às bordas
      // da grade, e a largura da grade depende da altura livre, algumas passadas estabilizam o cálculo.
      let xGrade = 22.5, larguraGrade = W - 45, linhasTopo, linhasRodape, gradeY, rodapeIni, legendaY, passo;
      for (let k = 0; k < 4; k++) {
        linhasTopo = montarLinhas(doTopo, xGrade, xGrade + larguraGrade);
        linhasRodape = montarLinhas(doRodape, xGrade, xGrade + larguraGrade);
        rodapeIni = H - MARGEM_BASE - alturaLinhas(linhasRodape);
        legendaY = rodapeIni - (doRodape.length ? 5 : 2);
        gradeY = Math.max(MARGEM_TOPO + alturaLinhas(linhasTopo) + (temCabecalho ? 7 : 5), 15);
        const gradeFim = op.legenda ? legendaY - 8 : rodapeIni - 5;
        passo = Math.min((W - 45) / (g.colunas + extraX), (gradeFim - gradeY) / (g.linhas + extraY));
        larguraGrade = passo * (g.colunas + extraX);
        xGrade = (W - larguraGrade) / 2; // centralizada; os rótulos ficam do lado de fora
      }
      const tam = passo * 0.78;
      const xColuna = (coluna) => xGrade + (coluna + desX[coluna]) * passo;
      const yLinha = (linha) => gradeY + (linha + desY[linha]) * passo;
      const xEsq = xGrade - 3;                                // rótulos da esquerda (alinhados à direita)
      const xDir = xGrade + larguraGrade - (passo - tam) + 3; // rótulos da direita
      const yCabecalho = gradeY - 1.6;
      const CINZA = "#787878";
      const contorno = CONTORNOS[op.contorno] || CONTORNOS.claro;

      // Cabeçalho: números das semanas ou nomes dos meses, centralizados no seu grupo;
      // o nome do mês encolhe para a inicial (ou some) quando o grupo é estreito demais
      g.topo.forEach((r) => {
        const ini = xColuna(r.coluna), fim = xColuna(r.coluna + r.n - 1) + tam;
        const pt = r.numero ? 6 : 6.5;
        const s = r.numero ? r.textos[0] : r.textos.find((x) => medirTexto(x, pt, "normal") <= fim - ini + 0.6);
        if (s) c.push({ t: "texto", x: (ini + fim) / 2, y: yCabecalho, s, pt, cor: CINZA, align: "center" });
      });

      // Laterais (idades ou anos à esquerda; idades à direita no modo calendário)
      g.esquerda.forEach((r) => c.push({ t: "texto", x: xEsq, y: yLinha(r.linha) + tam / 2 + 0.9, s: r.s, pt: 7, cor: CINZA, align: "right" }));
      g.direita.forEach((r) => c.push({ t: "texto", x: xDir, y: yLinha(r.linha) + tam / 2 + 0.9, s: r.s, pt: 7, cor: CINZA, align: "left" }));

      // Títulos: "Semana" no canto; nesse caso o título da esquerda ("Idade") vai na vertical
      if (g.tituloTopo) c.push({ t: "texto", x: xEsq, y: yCabecalho, s: g.tituloTopo, pt: 6, cor: CINZA, align: "right" });
      if (g.tituloEsquerda && g.tituloTopo) {
        const larguraRotulos = Math.max(0, ...g.esquerda.map((r) => medirTexto(r.s, 7, "normal")));
        const yMeio = gradeY + ((g.linhas + extraY) * passo) / 2;
        c.push({
          t: "texto", x: xEsq - larguraRotulos - 1.8, y: yMeio + medirTexto(g.tituloEsquerda, 7, "normal") / 2,
          s: g.tituloEsquerda, pt: 7, cor: CINZA, angulo: 90
        });
      } else if (g.tituloEsquerda) {
        c.push({ t: "texto", x: xEsq, y: yCabecalho, s: g.tituloEsquerda, pt: 7, cor: CINZA, align: "right" });
      }
      if (g.tituloDireita) c.push({ t: "texto", x: xDir, y: yCabecalho, s: g.tituloDireita, pt: 7, cor: CINZA, align: "left" });

      // Cada semana: quadrado ou círculo, ocupando o mesmo espaço
      const circulo = op.formato === "circulo";
      const marca = (x, y, medida, estilo) => c.push(circulo
        ? { t: "circ", x: x + medida / 2, y: y + medida / 2, r: medida / 2, ...estilo }
        : { t: "rect", x, y, w: medida, h: medida, ...estilo });

      g.celulas.forEach(({ linha, coluna, tipo }) => {
        const x = xColuna(coluna);
        const y = yLinha(linha);
        if (tipo === "vivida") {
          marca(x, y, tam, { fill: op.corVividas });
        } else if (tipo === "atual") {
          // Semana atual: um pouco maior, centralizada, para se destacar
          const maior = tam * 1.25;
          const d = (maior - tam) / 2;
          marca(x - d, y - d, maior, { fill: op.corAtual });
        } else {
          marca(x, y, tam, { stroke: contorno.cor, lw: contorno.lw });
        }
      });

      // Legenda
      if (op.legenda) {
        const ly = legendaY;
        const itens = [];
        if (op.preencher) itens.push({ fill: op.corVividas, s: t.legVividas });
        if (op.atual) itens.push({ fill: op.corAtual, s: t.legAtual });
        itens.push({ stroke: contorno.cor, s: op.preencher ? t.legRestantes : t.legSemana });
        // Distribui os itens centralizados na página
        const larg = 44;
        itens.forEach((it, k) => { it.x = W / 2 - (itens.length * larg) / 2 + 6 + k * larg; });
        itens.forEach((it) => {
          marca(it.x, ly - 3, 3, it.fill ? { fill: it.fill } : { stroke: it.stroke, lw: contorno.lw });
          c.push({ t: "texto", x: it.x + 5, y: ly, s: it.s, pt: 9, cor: "#3c3c3c", align: "left" });
        });
      }

      // Textos: os de cada linha ficam alinhados pela base
      const desenharLinhas = (linhas, yInicial) => {
        let y = yInicial;
        linhas.forEach((ln) => {
          const base = y + ln.altura;
          ln.itens.forEach(({ b, x }) => {
            const yItem = base - b.altura;
            if (b.tipo === "assinatura") {
              c.push({ t: "img", src: b.valor, x, y: yItem, w: b.w, h: b.h });
            } else {
              const l = lado(b);
              const xt = l === "esq" ? x : l === "dir" ? x + b.largura : x + b.largura / 2;
              const align = l === "esq" ? "left" : l === "dir" ? "right" : "center";
              c.push({ t: "texto", x: xt, y: yItem + b.mm * 0.8, s: b.valor.trim(), pt: b.pt, estilo: b.estilo, cor: b.cor, align });
            }
          });
          y = base + GAP;
        });
      };
      desenharLinhas(linhasTopo, MARGEM_TOPO);
      desenharLinhas(linhasRodape, rodapeIni);

      return c;
    }

    // Só entra no PDF o que está ligado e tem conteúdo; calcula a altura de cada bloco em mm
    function blocosVisiveis(lista) {
      return (lista || [])
        .filter((b) => b.ativo && POSICOES.includes(b.pos) && typeof b.valor === "string" && b.valor.trim())
        .map((b) => {
          const f = TAMANHOS[b.tam] || 1;
          if (b.tipo === "assinatura") {
            const prop = b.proporcao > 0 ? b.proporcao : 3;
            const w = Math.min(ASSINATURA_ALT * f * prop, ASSINATURA_LARG * f);
            const h = w / prop;
            return { ...b, w, h, altura: h, largura: w };
          }
          const e = ESTILO_TEXTO[b.tipo] || ESTILO_TEXTO.livre;
          const pt = e.pt * f;
          const mm = pt * 0.3528;
          return { ...b, pt, mm, estilo: e.estilo, cor: e.cor, altura: mm * 1.25, largura: medirTexto(b.valor.trim(), pt, e.estilo) };
        });
    }

    // Largura de um texto em mm (Helvetica, a mesma fonte do PDF)
    let ctxMedida;
    function medirTexto(texto, pt, estilo) {
      ctxMedida = ctxMedida || document.createElement("canvas").getContext("2d");
      ctxMedida.font = `${estilo === "italic" ? "italic " : ""}${estilo === "bold" ? "bold " : ""}${pt}px Helvetica, Arial, sans-serif`;
      return ctxMedida.measureText(texto).width * 0.3528;
    }

    // Imagens (assinatura) carregadas uma vez para a prévia
    const imagens = {};
    function imagem(src) {
      if (!imagens[src]) {
        const im = new Image();
        im.onload = () => atualizarPrevia();
        im.src = src;
        imagens[src] = im;
      }
      return imagens[src];
    }

    // ---------- Desenho na prévia (canvas) ----------
    function desenharCanvas(ctx, cmds, px) {
      cmds.forEach((c) => {
        if (c.t === "rect") {
          if (c.fill) {
            ctx.fillStyle = c.fill;
            ctx.fillRect(c.x * px, c.y * px, c.w * px, c.h * px);
          }
          if (c.stroke) {
            ctx.strokeStyle = c.stroke;
            ctx.lineWidth = c.lw * px;
            ctx.strokeRect(c.x * px, c.y * px, c.w * px, c.h * px);
          }
        } else if (c.t === "circ") {
          ctx.beginPath();
          ctx.arc(c.x * px, c.y * px, c.r * px, 0, Math.PI * 2);
          if (c.fill) {
            ctx.fillStyle = c.fill;
            ctx.fill();
          }
          if (c.stroke) {
            ctx.strokeStyle = c.stroke;
            ctx.lineWidth = c.lw * px;
            ctx.stroke();
          }
        } else if (c.t === "texto") {
          const estilo = (c.estilo === "italic" ? "italic " : "") + (c.estilo === "bold" ? "bold " : "");
          ctx.font = `${estilo}${c.pt * 0.3528 * px}px Helvetica, Arial, sans-serif`;
          ctx.fillStyle = c.cor;
          ctx.textBaseline = "alphabetic";
          if (c.angulo) {
            // Texto girado (sentido anti-horário), lido de baixo para cima
            ctx.save();
            ctx.translate(c.x * px, c.y * px);
            ctx.rotate((-c.angulo * Math.PI) / 180);
            ctx.textAlign = "left";
            ctx.fillText(c.s, 0, 0);
            ctx.restore();
          } else {
            ctx.textAlign = c.align || "left";
            ctx.fillText(c.s, c.x * px, c.y * px);
          }
        } else if (c.t === "img") {
          const im = imagem(c.src);
          if (im.complete && im.naturalWidth) ctx.drawImage(im, c.x * px, c.y * px, c.w * px, c.h * px);
        }
      });
    }

    // ---------- Desenho no PDF (jsPDF) ----------
    function desenharPDF(doc, cmds) {
      cmds.forEach((c) => {
        if (c.t === "rect" || c.t === "circ") {
          if (c.fill) doc.setFillColor(...hexParaRgb(c.fill));
          if (c.stroke) {
            doc.setDrawColor(...hexParaRgb(c.stroke));
            doc.setLineWidth(c.lw);
          }
          const estilo = c.fill && c.stroke ? "FD" : c.fill ? "F" : "S";
          if (c.t === "rect") doc.rect(c.x, c.y, c.w, c.h, estilo);
          else doc.circle(c.x, c.y, c.r, estilo);
        } else if (c.t === "texto") {
          doc.setFont("helvetica", c.estilo || "normal");
          doc.setFontSize(c.pt);
          doc.setTextColor(...hexParaRgb(c.cor));
          doc.text(c.s, c.x, c.y, c.angulo ? { angle: c.angulo } : { align: c.align || "left" });
        } else if (c.t === "img") {
          doc.addImage(c.src, "PNG", c.x, c.y, c.w, c.h);
        }
      });
    }

    // ---------- Prévia na tela ----------
    function atualizarPrevia() {
      const t = TEXTOS[idioma];
      const op = lerOpcoes();
      atualizarControles(op);
      const canvas = $("previa");

      // O canvas ocupa a moldura inteira; a folha é desenhada dentro dele (centralizada, ou
      // onde o zoom deixou), sempre na resolução real da tela
      const moldura = canvas.parentElement;
      const estilo = getComputedStyle(moldura);
      const W = moldura.clientWidth, H = moldura.clientHeight;
      const dispW = W - parseFloat(estilo.paddingLeft) - parseFloat(estilo.paddingRight);
      const dispH = H - parseFloat(estilo.paddingTop) - parseFloat(estilo.paddingBottom);
      const papel = PAPEIS[op.papel] || PAPEIS.a4;
      let w = dispW > 0 ? dispW : 300;
      let h = w * papel.h / papel.w;
      if (dispH > 0 && h > dispH) {
        h = dispH;
        w = h * papel.w / papel.h;
      }
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      Object.assign(vista, { W, H, w, h, dpr, papel, cmds: null });
      pintarPrevia();

      if (precisaDaData(op) && !op.nascimento) {
        $("resumo").textContent = t.previaVazia;
        mostrarMensagem("", "");
        return;
      }
      const erro = validar(op, t);
      if (erro) {
        $("resumo").textContent = "";
        mostrarMensagem(erro, "erro");
        return;
      }

      const cmds = layout(op, t);
      vista.cmds = cmds;
      pintarPrevia();

      // Resumo: onde está a semana de hoje na grade e a contagem (1.654 e 35,3% em português)
      const num = (n, formato) => n.toLocaleString(localeAtual(), formato);
      const hoje = op.atual || op.preencher ? textoHoje(op, t) : "";
      if (!op.preencher) {
        $("resumo").textContent = (hoje ? hoje + "\n" : "") + t.resumoVazio(num(cmds.info.celulas));
        mostrarMensagem("", "");
        return;
      }
      const ct = contagem(op);
      const pct = num(ct.vividas / ct.total, { style: "percent", minimumFractionDigits: 1, maximumFractionDigits: 1 });
      $("resumo").textContent = (hoje ? hoje + "\n" : "") + t.resumo(num(ct.vividas), num(ct.restantes), pct);

      if (ct.passou) mostrarMensagem(t.avisoExpectativa, "aviso");
      else mostrarMensagem("", "");
    }

    // "Hoje: ..." — onde achar a semana atual na grade, do jeito de cada organização
    function textoHoje(op, t) {
      const nasc = dataNascimento(op), hoje = hojeLocal();
      if (!nasc) return "";
      const fim = new Date(nasc.getFullYear() + op.anos, nasc.getMonth(), nasc.getDate());
      if (hoje >= fim) return "";
      if (op.linhasPor === "civil") {
        const quarta = somarDias(inicioDaSemana(hoje, op.primeiroDia), 3);
        return t.hojeCivil(Math.floor((quarta.getDate() - 1) / 7) + 1, t.mesesLongos[quarta.getMonth()], quarta.getFullYear());
      }
      const p = posicaoNaVida(nasc, hoje);
      return t.hojeVida(p.anos, p.semana + 1);
    }

    // Liga, desliga e renomeia controles conforme as escolhas (a data só é pedida quando é usada)
    function atualizarControles(op) {
      const t = TEXTOS[idioma];
      const civil = op.linhasPor === "civil";
      const mesesReais = !civil && op.divSemanas === "meses";
      $("nascimento").disabled = !(precisaDaData(op) || mesesReais);
      $("corVividas").disabled = !op.preencher;
      $("corAtual").disabled = !op.atual;
      $("linha-divSemanas").hidden = civil; // no calendário, as semanas já ficam separadas por mês
      $("lbl-rotulos").textContent = civil ? t.rotulosCivil : t.rotulos;
      $("lbl-numerar").textContent = civil || (mesesReais && dataNascimento(op)) ? t.numerarMeses : t.numerar;
    }

    function mostrarMensagem(texto, tipo) {
      const el = $("msg");
      el.textContent = texto;
      el.className = "msg" + (tipo ? " " + tipo : "");
    }

    // ---------- PDF ----------
    // iPhone/iPad: a janela de compartilhar do sistema (Salvar em Arquivos, Imprimir, WhatsApp...)
    // funciona melhor que o download, principalmente no app instalado na Tela de Início
    const EH_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    const USA_COMPARTILHAR = EH_IOS && typeof navigator.canShare === "function";

    // Conta no GoatCounter só que um PDF foi baixado (nada do que está nele). Se o contador
    // estiver bloqueado ou sem internet, o download segue normalmente
    function contarDownload() {
      try {
        if (window.goatcounter && window.goatcounter.count) {
          window.goatcounter.count({ path: "baixou-pdf", title: "Baixou o PDF", event: true });
        }
      } catch (e) { /* ignora */ }
    }

    async function entregarPDF(doc, t) {
      if (USA_COMPARTILHAR) {
        const arquivo = new File([doc.output("blob")], t.pdfArquivo, { type: "application/pdf" });
        if (navigator.canShare({ files: [arquivo] })) {
          try {
            await navigator.share({ files: [arquivo], title: t.pdfTitulo });
            contarDownload();
            return;
          } catch (e) {
            if (e.name === "AbortError") return; // a pessoa fechou a janela de compartilhar
          }
        }
      }
      doc.save(t.pdfArquivo);
      contarDownload();
    }

    async function baixarPDF() {
      const t = TEXTOS[idioma];
      const op = lerOpcoes();
      const erro = validar(op, t);
      if (erro) {
        mostrarMensagem(erro, "erro");
        return;
      }

      const botao = $("botao");
      const textoOriginal = botao.textContent;
      botao.disabled = true;
      botao.textContent = t.gerando;
      try {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ unit: "mm", format: (PAPEIS[op.papel] || PAPEIS.a4).jspdf, orientation: "portrait", compress: true });
        desenharPDF(doc, layout(op, t));
        await entregarPDF(doc, t);
        if (op.preencher && contagem(op).passou) mostrarMensagem(t.avisoExpectativa, "aviso");
      } catch (e) {
        console.error(e);
        mostrarMensagem(t.erroGerar, "erro");
      } finally {
        botao.disabled = false;
        botao.textContent = textoOriginal;
      }
    }

    // ---------- Configurações salvas no navegador ----------
    function salvarConfig() {
      try { localStorage.setItem(CHAVE_CONFIG, JSON.stringify(lerOpcoes())); } catch (e) { /* ignora */ }
    }

    function carregarConfig() {
      try {
        const salvo = JSON.parse(localStorage.getItem(CHAVE_CONFIG) || "null");
        if (!salvo) return;
        const t = TEXTOS[idioma];
        if (Array.isArray(salvo.textos)) {
          textos = salvo.textos
            .filter((b) => b && (ESTILO_TEXTO[b.tipo] || b.tipo === "assinatura"))
            .map((b) => ({
              ...b,
              valor: typeof b.valor === "string" ? b.valor : "",
              pos: POSICOES.includes(b.pos) ? b.pos : "rodape-centro",
              tam: TAMANHOS[b.tam] ? b.tam : "m"
            }))
            // Assinatura só vale se for uma imagem PNG de verdade (dado adulterado é descartado)
            .map((b) => {
              if (b.tipo !== "assinatura") return b;
              const valida = /^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(b.valor);
              const proporcao = Number(b.proporcao);
              return {
                ...b,
                valor: valida ? b.valor : "",
                ativo: valida ? b.ativo : false,
                proporcao: proporcao >= 0.2 && proporcao <= 20 ? proporcao : 3
              };
            });
        } else {
          // Configuração de versões anteriores: aproveita o nome e a frase escolhida
          textos = textosPadrao(t);
          if (typeof salvo.nome === "string") textos[1].valor = salvo.nome;
          if (Number.isInteger(salvo.frase) && t.frases[salvo.frase]) textos[2].valor = t.frases[salvo.frase];
        }
        if (salvo.nascimento) $("nascimento").value = salvo.nascimento;
        if (salvo.anos) $("expectativa").value = salvo.anos;
        if (salvo.corVividas) $("corVividas").value = salvo.corVividas;
        if (salvo.corAtual) $("corAtual").value = salvo.corAtual;
        if (salvo.legenda !== undefined) $("legenda").checked = salvo.legenda;
        if (salvo.atual !== undefined) $("atual").checked = salvo.atual;
        if (salvo.preencher !== undefined) $("preencher").checked = salvo.preencher;
        if (salvo.rotulos !== undefined) $("rotulos").checked = salvo.rotulos;
        if (FORMATOS.includes(salvo.formato)) $("formato-" + salvo.formato).checked = true;
        if (["vida", "civil"].includes(salvo.linhasPor)) $("linhasPor-" + salvo.linhasPor).checked = true;
        if (DIV_ANOS.includes(salvo.divAnos)) $("divAnos-" + salvo.divAnos).checked = true;
        if (DIV_SEMANAS.includes(salvo.divSemanas)) $("divSemanas-" + salvo.divSemanas).checked = true;
        if (salvo.numerar !== undefined) $("numerar").checked = salvo.numerar;
        if (Object.keys(CONTORNOS).includes(salvo.contorno)) $("contorno-" + salvo.contorno).checked = true;
        if (Object.keys(PAPEIS).includes(salvo.papel)) $("papel-" + salvo.papel).checked = true;
        // Aberto em outro idioma (ex.: link com ?lang=en): título e frases padrão vêm traduzidos
        if (TEXTOS[salvo.idioma]) traduzirTextosPadrao(salvo.idioma, idioma);
        $("idioma").value = idioma;
      } catch (e) { /* configuração inválida: usa os padrões */ }
    }

    // ---------- Interface ----------
    function preencherSelects() {
      const selIdioma = $("idioma");
      selIdioma.innerHTML = "";
      Object.keys(TEXTOS).forEach((codigo) => {
        const opt = document.createElement("option");
        opt.value = codigo;
        opt.textContent = TEXTOS[codigo].nomeIdioma;
        selIdioma.appendChild(opt);
      });
      selIdioma.value = idioma;
      // Esconde a escolha de idioma enquanto houver só um
    }

    function aplicarTextos() {
      const t = TEXTOS[idioma];
      document.documentElement.lang = t.locale || idioma;
      if (idioma !== IDIOMA_PAGINA) { // a página do próprio idioma mantém o título pensado para as buscas
        document.title = t.titulo;
        document.querySelector('meta[name="description"]').setAttribute("content", t.descricao);
      }
      $("titulo").textContent = t.pdfTitulo;
      $("titulo-painel").textContent = t.pdfTitulo;
      document.querySelector(".config").setAttribute("aria-label", t.ariaConfig);
      document.querySelector(".previa").setAttribute("aria-label", t.ariaPrevia);
      $("previa").setAttribute("aria-label", t.ariaCanvas);
      document.querySelector(".abas").setAttribute("aria-label", t.ariaAbas);
      $("lbl-papel").textContent = t.papel;
      Object.keys(PAPEIS).forEach((p) => {
        $("papel-" + p).nextElementSibling.textContent = t.papelOpcoes[p];
        $("papel-" + p).parentElement.title = t.papelDicas[p];
      });
      $("aba-config").textContent = t.abaConfig;
      $("aba-previa").textContent = t.abaPrevia;
      $("sec-dados").textContent = t.secDados;
      $("sec-calendario").textContent = t.secCalendario;
      $("sec-textos").textContent = t.secTextos;
      $("lbl-nascimento").textContent = t.nascimento;
      $("lbl-expectativa").textContent = t.expectativa;
      $("lbl-preencher").textContent = t.preencher;
      $("lbl-atual").textContent = t.destacarAtual;
      $("lbl-legenda").textContent = t.legenda;
      $("lbl-rotulos").textContent = t.rotulos;
      $("lbl-formato").textContent = t.formato;
      $("sec-divisoes").textContent = t.secDivisoes;
      $("dica-divisoes").textContent = t.dicaDivisoes;
      $("lbl-divAnos").textContent = t.divAnos;
      $("lbl-divSemanas").textContent = t.divSemanas;
      $("lbl-numerar").textContent = t.numerar;
      $("lbl-contorno").textContent = t.contorno;
      $("lbl-linhasPor").textContent = t.linhasPor;
      ["vida", "civil"].forEach((v) => {
        const corpo = $("linhasPor-" + v).nextElementSibling;
        corpo.querySelector("strong").textContent = t.linhasPorOpcoes[v];
        corpo.querySelector("small").textContent = t.linhasPorDicas[v];
      });
      // Escolhas com texto: nome visível e uma dica ao passar o mouse
      [["divAnos", DIV_ANOS], ["divSemanas", DIV_SEMANAS], ["contorno", Object.keys(CONTORNOS)]].forEach(([grupo, valores]) => {
        valores.forEach((v) => {
          const opcao = $(`${grupo}-${v}`);
          opcao.nextElementSibling.textContent = t[grupo + "Opcoes"][v];
          opcao.parentElement.title = t[grupo + "Dicas"][v];
        });
      });
      FORMATOS.forEach((f) => {
        $("formato-" + f).setAttribute("aria-label", t.formatos[f]);
        $("formato-" + f).parentElement.title = t.formatos[f];
      });
      [["corVividas", t.corVividas], ["corAtual", t.corAtual]].forEach(([id, nome]) => {
        $(id).setAttribute("aria-label", nome);
        $(id).title = nome;
      });
      ZONAS.forEach((z) => { $("lbl-zona-" + z).textContent = t.zonas[z]; });
      document.querySelectorAll(".btn-add").forEach((bt) => {
        bt.textContent = t.addTexto;
        bt.setAttribute("aria-label", `${t.addTexto.replace(/^\+\s*/, "")}: ${t.zonas[bt.dataset.zona]}`);
      });
      $("restaurar").textContent = t.restaurar;
      aplicarTextosApoio(t);
      $("dlg-titulo").textContent = t.dlgTitulo;
      $("dlg-dica").textContent = t.dlgDica;
      $("pad-limpar").textContent = t.limpar;
      $("pad-cancelar").textContent = t.cancelar;
      $("pad-salvar").textContent = t.salvar;
      $("pad-importar").textContent = t.importar;
      $("pad-foto").textContent = t.foto;
      $("camera-voltar").textContent = t.voltar;
      $("camera-capturar").textContent = t.capturar;
      $("lbl-sens").textContent = t.sensibilidade;
      $("lbl-preta").textContent = t.tintaPreta;
      $("idioma").setAttribute("aria-label", t.idioma);
      $("escolha-idioma").title = t.idioma;
      $("botao").textContent = USA_COMPARTILHAR ? t.botaoCompartilhar : t.botao;
      $("info").textContent = t.info;

      // Sugestões para o campo da frase
      $("sugestoes-frase").innerHTML = "";
      t.frases.forEach((f) => {
        const opt = document.createElement("option");
        opt.value = f;
        $("sugestoes-frase").appendChild(opt);
      });
      renderTextos();
    }

    // ---------- Lista de textos do PDF ----------
    // Ícones (SVG fixos, definidos aqui mesmo)
    const ICONES = {
      esq: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5h12M2 6.5h8M2 9.5h12M2 12.5h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
      centro: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5h12M4 6.5h8M2 9.5h12M4 12.5h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
      dir: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5h12M6 6.5h8M2 9.5h12M6 12.5h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
      subir: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 10l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      descer: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      remover: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h11M6.5 4.5V3h3v1.5M4 4.5l.7 9h6.6l.7-9M6.7 7v4.5M9.3 7v4.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    };

    // Identificador de cada texto enquanto a página está aberta (não é salvo)
    const idsTexto = new WeakMap();
    let proximoId = 1;
    function idDe(b) {
      if (!idsTexto.has(b)) idsTexto.set(b, proximoId++);
      return idsTexto.get(b);
    }

    function criar(tag, classe, props) {
      const el = document.createElement(tag);
      if (classe) el.className = classe;
      if (props) Object.assign(el, props);
      return el;
    }

    function botaoIcone(icone, rotulo, desativado, aoClicar, foco, classeExtra) {
      const bt = criar("button", "btn-icone" + (classeExtra ? " " + classeExtra : ""), { type: "button", title: rotulo, disabled: desativado });
      bt.setAttribute("aria-label", rotulo);
      bt.innerHTML = ICONES[icone];
      if (foco) bt.dataset.foco = foco;
      bt.addEventListener("click", aoClicar);
      return bt;
    }

    // Botões segmentados: escolha única entre poucas opções (alinhamento, tamanho)
    function segmentado(nome, rotulo, opcoes, valor, aoMudar, foco) {
      const grupo = criar("div", "seg");
      grupo.setAttribute("role", "radiogroup");
      grupo.setAttribute("aria-label", rotulo);
      opcoes.forEach((o) => {
        const lab = criar("label", "", { title: o.titulo });
        const inp = criar("input", "", { type: "radio", name: nome, value: o.valor, checked: o.valor === valor });
        inp.setAttribute("aria-label", o.titulo);
        inp.dataset.foco = `${foco}-${o.valor}`;
        inp.addEventListener("change", () => { if (inp.checked) aoMudar(o.valor); });
        const visual = criar("span");
        visual.innerHTML = o.html; // ícones e letras fixos, definidos neste arquivo
        lab.append(inp, visual);
        grupo.append(lab);
      });
      return grupo;
    }

    // A lista segue a ordem da página: primeiro os textos do topo, depois os do rodapé.
    // Dentro de cada área, a ordem da lista é a ordem em que eles aparecem empilhados no PDF.
    function ordenarPorZona() {
      textos = ZONAS.flatMap((z) => textos.filter((b) => zonaDe(b) === z));
    }

    // Monta os cartões de texto. "realcar": texto que acabou de mudar de lugar (pisca e fica à vista)
    function renderTextos(realcar) {
      const t = TEXTOS[idioma];
      const ativo = document.activeElement;
      const foco = ativo && ativo.dataset ? ativo.dataset.foco : "";
      ordenarPorZona();
      ZONAS.forEach((z) => { $("lista-" + z).innerHTML = ""; });
      textos.forEach((b, i) => $("lista-" + zonaDe(b)).append(cartaoTexto(b, i, t)));

      // Devolve o foco ao mesmo controle (útil no teclado); se a seta ficou desativada, vai para a outra
      if (foco) {
        let el = document.querySelector(`[data-foco="${foco}"]`);
        if (el && el.disabled) {
          const outra = foco.endsWith("-subir") ? foco.replace(/-subir$/, "-descer") : foco.replace(/-descer$/, "-subir");
          el = document.querySelector(`[data-foco="${outra}"]`);
        }
        if (el && !el.disabled) el.focus({ preventScroll: true });
      }
      if (realcar) {
        const cartao = document.querySelector(`.item-texto[data-id="${idDe(realcar)}"]`);
        if (cartao) {
          cartao.classList.add("realce");
          cartao.scrollIntoView({ block: "nearest", behavior: "smooth" });
        }
      }
    }

    function cartaoTexto(b, i, t) {
      const id = idDe(b);
      const zona = zonaDe(b);
      const nome = t.tiposTexto[b.tipo] || t.tiposTexto.livre;
      const item = criar("div", "item-texto" + (b.ativo ? "" : " desligado"));
      item.dataset.id = id;

      // Cabeçalho: liga/desliga com o nome, setas de ordem e (texto livre) remover
      const topo = criar("div", "item-topo");
      const lab = criar("label", "interruptor");
      const chk = criar("input", "", { type: "checkbox", checked: b.ativo });
      chk.setAttribute("role", "switch");
      chk.dataset.foco = id + "-ativo";
      const trilho = criar("span", "trilho");
      trilho.setAttribute("aria-hidden", "true");
      lab.append(chk, trilho, criar("span", "item-nome", { textContent: nome }));
      topo.append(lab);

      // Setas: trocam a ordem dentro da área; na divisa entre topo e rodapé, passam o texto para a outra área
      const mesmaAntes = i > 0 && zonaDe(textos[i - 1]) === zona;
      const mesmaDepois = i < textos.length - 1 && zonaDe(textos[i + 1]) === zona;
      const rotuloSubir = mesmaAntes ? t.subir : t.paraTopo;
      const rotuloDescer = mesmaDepois ? t.descer : t.paraRodape;
      topo.append(
        botaoIcone("subir", rotuloSubir, !mesmaAntes && zona === "topo", () => mover(b, -1), id + "-subir"),
        botaoIcone("descer", rotuloDescer, !mesmaDepois && zona === "rodape", () => mover(b, 1), id + "-descer")
      );
      if (b.tipo === "livre") topo.append(botaoIcone("remover", t.remover, false, () => remover(b), null, "perigo"));

      const campos = criar("div", "item-campos");
      campos.hidden = !b.ativo;
      chk.addEventListener("change", () => {
        b.ativo = chk.checked;
        campos.hidden = !b.ativo;
        item.classList.toggle("desligado", !b.ativo);
        mudouTextos();
      });

      if (b.tipo === "assinatura") {
        const linha = criar("div", "assinatura-linha");
        const bt = criar("button", "btn-sec", { type: "button", textContent: b.valor ? t.refazerAssinatura : t.desenharAssinatura });
        bt.dataset.foco = id + "-assinar";
        bt.addEventListener("click", () => abrirPad(b));
        linha.append(bt);
        if (b.valor) linha.append(criar("img", "mini-assinatura", { src: b.valor, alt: nome }));
        campos.append(linha);
      } else {
        const inp = criar("input", "", {
          type: "text", maxLength: 80, value: b.valor,
          placeholder: t.placeholders[b.tipo] || "", autocomplete: "off"
        });
        inp.setAttribute("aria-label", nome);
        inp.dataset.foco = id + "-texto";
        if (b.tipo === "frase") inp.setAttribute("list", "sugestoes-frase");
        // Aviso logo abaixo do campo quando há letras que a fonte do PDF não imprime (ex.: ł, 日, emoji)
        const aviso = criar("p", "aviso-campo");
        aviso.setAttribute("role", "status");
        const avisar = () => {
          const ruins = semSuporte(inp.value);
          aviso.hidden = !ruins;
          aviso.textContent = ruins ? t.avisoCaracteres + ruins : "";
        };
        avisar();
        inp.addEventListener("input", () => { b.valor = inp.value; avisar(); mudouTextos(); });
        campos.append(inp, aviso);
      }

      const controles = criar("div", "item-controles");
      controles.append(
        segmentado(`alinhamento-${id}`, t.alinhamento,
          LADOS.map((l) => ({ valor: l, html: ICONES[l], titulo: t.alinhamentos[l] })),
          ladoDe(b), (l) => { b.pos = `${zonaDe(b)}-${l}`; mudouTextos(); }, `${id}-alinhamento`),
        segmentado(`tamanho-${id}`, t.tamanho,
          Object.keys(TAMANHOS).map((k) => ({ valor: k, html: `<b class="letra-${k}">A</b>`, titulo: t.tamanhos[k] })),
          b.tam, (k) => { b.tam = k; mudouTextos(); }, `${id}-tamanho`)
      );
      campos.append(controles);
      item.append(topo, campos);
      return item;
    }

    function mover(b, direcao) {
      const i = textos.indexOf(b);
      const vizinho = textos[i + direcao];
      if (vizinho && zonaDe(vizinho) === zonaDe(b)) {
        textos[i] = vizinho;
        textos[i + direcao] = b;
      } else if (direcao < 0 && zonaDe(b) === "rodape") {
        b.pos = `topo-${ladoDe(b)}`;    // último do topo
      } else if (direcao > 0 && zonaDe(b) === "topo") {
        b.pos = `rodape-${ladoDe(b)}`;  // primeiro do rodapé
      } else {
        return;
      }
      renderTextos(b);
      mudouTextos();
    }

    function remover(b) {
      const zona = zonaDe(b);
      textos = textos.filter((x) => x !== b);
      renderTextos();
      mudouTextos();
      document.querySelector(`.btn-add[data-zona="${zona}"]`).focus();
    }

    function mudouTextos() { salvarConfig(); atualizarPrevia(); }

    // ---------- Assinatura desenhada ----------
    let assinaturaAlvo = null;
    let tracou = false;

    function abrirPad(bloco) {
      assinaturaAlvo = bloco;
      $("dlg-assinatura").showModal();
      const pad = $("pad");
      const dpr = window.devicePixelRatio || 1;
      pad.width = Math.round(pad.clientWidth * dpr);
      pad.height = Math.round(pad.clientHeight * dpr);
      const ctx = pad.getContext("2d");
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.lineWidth = 2.6 * dpr;
      ctx.strokeStyle = "#1a1a1a";
      ctx.fillStyle = "#1a1a1a";
      tracou = false;
      fotoOriginal = null;
      $("pad-ajuste").hidden = true;
      $("dlg-dica").textContent = TEXTOS[idioma].dlgDica;
    }

    (function prepararPad() {
      const pad = $("pad");
      const ctx = pad.getContext("2d");
      let desenhando = false, ultimo = null;
      const ponto = (e) => {
        const r = pad.getBoundingClientRect();
        return { x: (e.clientX - r.left) * pad.width / r.width, y: (e.clientY - r.top) * pad.height / r.height };
      };
      pad.addEventListener("pointerdown", (e) => {
        desenhando = true;
        pad.setPointerCapture(e.pointerId);
        ultimo = ponto(e);
        ctx.beginPath();
        ctx.arc(ultimo.x, ultimo.y, ctx.lineWidth / 2, 0, Math.PI * 2);
        ctx.fill();
        tracou = true;
      });
      pad.addEventListener("pointermove", (e) => {
        if (!desenhando) return;
        const p = ponto(e);
        ctx.beginPath();
        ctx.moveTo(ultimo.x, ultimo.y);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
        ultimo = p;
      });
      const parar = () => { desenhando = false; };
      pad.addEventListener("pointerup", parar);
      pad.addEventListener("pointercancel", parar);

      $("pad-limpar").addEventListener("click", () => {
        ctx.clearRect(0, 0, pad.width, pad.height);
        tracou = false;
        fotoOriginal = null;
        $("pad-ajuste").hidden = true;
        $("dlg-dica").textContent = TEXTOS[idioma].dlgDica;
      });

      // Importar imagem ou tirar foto.
      // Celular/tablet: "Tirar foto" abre a câmera do aparelho (input com capture).
      // Computador: esse input só abriria a escolha de arquivo, então a webcam abre aqui mesmo.
      $("pad-importar").addEventListener("click", () => $("arq-importar").click());
      $("pad-foto").addEventListener("click", () => {
        const toque = window.matchMedia("(pointer: coarse)").matches;
        const temWebcam = navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
        if (toque || !temWebcam) $("arq-foto").click();
        else abrirCamera();
      });
      ["arq-importar", "arq-foto"].forEach((id) => {
        $(id).addEventListener("change", (e) => {
          const arq = e.target.files && e.target.files[0];
          e.target.value = "";
          if (!arq) return;
          const url = URL.createObjectURL(arq);
          const im = new Image();
          im.onload = () => {
            URL.revokeObjectURL(url);
            usarImagem(im);
          };
          im.onerror = () => {
            URL.revokeObjectURL(url);
            $("dlg-dica").textContent = TEXTOS[idioma].erroImagem;
          };
          im.src = url;
        });
      });
      $("pad-sens").addEventListener("input", mostrarFotoNoPad);
      $("pad-preta").addEventListener("change", mostrarFotoNoPad);

      function usarImagem(img) {
        fotoOriginal = img;
        $("pad-ajuste").hidden = false;
        $("dlg-dica").textContent = TEXTOS[idioma].dlgDicaImportada;
        mostrarFotoNoPad();
      }

      // ---------- Webcam (computador) ----------
      let fluxoCamera = null;
      let pedidoCamera = 0; // invalida pedidos antigos se a pessoa voltar ou fechar antes da câmera abrir

      function modoCamera(ligado) {
        $("camera").hidden = !ligado;
        $("camera-botoes").hidden = !ligado;
        pad.hidden = ligado;
        $("pad-botoes").hidden = ligado;
        document.querySelector(".dlg-fontes").hidden = ligado;
        $("pad-ajuste").hidden = ligado || !fotoOriginal;
      }

      function pararCamera() {
        pedidoCamera++;
        if (fluxoCamera) fluxoCamera.getTracks().forEach((faixa) => faixa.stop());
        fluxoCamera = null;
        $("camera-video").srcObject = null;
      }

      async function abrirCamera() {
        const meu = ++pedidoCamera;
        const video = $("camera-video");
        $("camera-capturar").disabled = true;
        modoCamera(true);
        $("dlg-dica").textContent = TEXTOS[idioma].cameraDica;
        try {
          const fluxo = await navigator.mediaDevices.getUserMedia({
            video: { width: { ideal: 1920 }, height: { ideal: 1080 } },
            audio: false
          });
          if (meu !== pedidoCamera) { fluxo.getTracks().forEach((faixa) => faixa.stop()); return; }
          fluxoCamera = fluxo;
          video.srcObject = fluxo;
          await video.play();
          if (meu === pedidoCamera) $("camera-capturar").disabled = false;
        } catch (e) {
          if (meu !== pedidoCamera) return;
          pararCamera();
          modoCamera(false);
          $("dlg-dica").textContent = TEXTOS[idioma].erroCamera;
        }
      }

      $("camera-capturar").addEventListener("click", () => {
        const video = $("camera-video");
        const vw = video.videoWidth, vh = video.videoHeight;
        if (!vw || !vh) return;
        // Usa só a área do retângulo-guia (deixa de fora mãos e o fundo da sala)
        const rv = video.getBoundingClientRect(), rg = $("camera-guia").getBoundingClientRect();
        const sx = Math.max(0, (rg.left - rv.left) / rv.width * vw);
        const sy = Math.max(0, (rg.top - rv.top) / rv.height * vh);
        const sw = Math.min(vw - sx, rg.width / rv.width * vw);
        const sh = Math.min(vh - sy, rg.height / rv.height * vh);
        const foto = document.createElement("canvas");
        foto.width = Math.max(1, Math.round(sw));
        foto.height = Math.max(1, Math.round(sh));
        foto.getContext("2d").drawImage(video, sx, sy, sw, sh, 0, 0, foto.width, foto.height);
        pararCamera();
        modoCamera(false);
        usarImagem(foto);
      });

      $("camera-voltar").addEventListener("click", () => {
        pararCamera();
        modoCamera(false);
        $("dlg-dica").textContent = fotoOriginal ? TEXTOS[idioma].dlgDicaImportada : TEXTOS[idioma].dlgDica;
      });

      // Fechar a janela (inclusive com Esc) sempre desliga a webcam
      $("dlg-assinatura").addEventListener("close", () => { pararCamera(); modoCamera(false); });

      // Desenha a assinatura importada (já sem fundo) centralizada no espaço de assinar
      function mostrarFotoNoPad() {
        if (!fotoOriginal) return;
        const limpa = removerFundo(fotoOriginal, Number($("pad-sens").value), $("pad-preta").checked);
        ctx.clearRect(0, 0, pad.width, pad.height);
        const m = 12 * (window.devicePixelRatio || 1);
        const esc = Math.min((pad.width - 2 * m) / limpa.width, (pad.height - 2 * m) / limpa.height);
        const w = limpa.width * esc, h = limpa.height * esc;
        ctx.drawImage(limpa, (pad.width - w) / 2, (pad.height - h) / 2, w, h);
        tracou = true;
      }
      $("pad-cancelar").addEventListener("click", () => $("dlg-assinatura").close());
      $("pad-salvar").addEventListener("click", () => {
        const recorte = tracou ? recortarAssinatura(pad) : null;
        if (assinaturaAlvo) {
          assinaturaAlvo.valor = recorte ? recorte.src : "";
          assinaturaAlvo.proporcao = recorte ? recorte.proporcao : 3;
          if (recorte) assinaturaAlvo.ativo = true;
        }
        $("dlg-assinatura").close();
        renderTextos();
        mudouTextos();
      });
    })();

    // Remove o fundo de uma foto ou imagem de assinatura, mantendo a escrita real.
    // 1) Estima o fundo de cada região (o papel, mesmo com sombra ou luz desigual);
    // 2) o que for mais escuro que o fundo vira tinta, com transparência proporcional (bordas suaves);
    // 3) apaga pontinhos soltos (poeira, textura do papel).
    let fotoOriginal = null;
    function removerFundo(img, sensibilidade, tintaPreta) {
      const MAX = 1200;
      const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height; // <img> ou <canvas> (webcam)
      const esc = Math.min(1, MAX / Math.max(iw, ih));
      const w = Math.max(1, Math.round(iw * esc));
      const h = Math.max(1, Math.round(ih * esc));
      const cv = document.createElement("canvas");
      cv.width = w; cv.height = h;
      const cx = cv.getContext("2d", { willReadFrequently: true });
      cx.fillStyle = "#fff"; // imagens com transparência: fundo branco antes de analisar
      cx.fillRect(0, 0, w, h);
      cx.drawImage(img, 0, 0, w, h);
      const im = cx.getImageData(0, 0, w, h);
      const d = im.data;
      const n = w * h;

      // Luminosidade de cada pixel
      const lum = new Float32Array(n);
      for (let i = 0; i < n; i++) lum[i] = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2];

      // Fundo: o pixel mais claro de cada bloco (o papel), suavizado entre blocos vizinhos
      const B = Math.max(8, Math.round(Math.max(w, h) / 40));
      const bw = Math.ceil(w / B), bh = Math.ceil(h / B);
      const blocoMax = new Float32Array(bw * bh);
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const k = Math.floor(y / B) * bw + Math.floor(x / B);
          if (lum[y * w + x] > blocoMax[k]) blocoMax[k] = lum[y * w + x];
        }
      }
      const fundoBloco = new Float32Array(bw * bh);
      for (let by = 0; by < bh; by++) {
        for (let bx = 0; bx < bw; bx++) {
          let soma = 0, cont = 0;
          for (let dy = -1; dy <= 1; dy++) {
            for (let dx = -1; dx <= 1; dx++) {
              const yy = by + dy, xx = bx + dx;
              if (yy >= 0 && yy < bh && xx >= 0 && xx < bw) { soma += blocoMax[yy * bw + xx]; cont++; }
            }
          }
          fundoBloco[by * bw + bx] = soma / cont;
        }
      }
      const fundoEm = (x, y) => {
        // interpolação bilinear entre os centros dos blocos
        const fx = Math.min(Math.max(x / B - 0.5, 0), bw - 1), fy = Math.min(Math.max(y / B - 0.5, 0), bh - 1);
        const x0 = Math.floor(fx), y0 = Math.floor(fy);
        const x1 = Math.min(x0 + 1, bw - 1), y1 = Math.min(y0 + 1, bh - 1);
        const ax = fx - x0, ay = fy - y0;
        const a = fundoBloco[y0 * bw + x0] * (1 - ax) + fundoBloco[y0 * bw + x1] * ax;
        const b = fundoBloco[y1 * bw + x0] * (1 - ax) + fundoBloco[y1 * bw + x1] * ax;
        return a * (1 - ay) + b * ay;
      };

      // Tinta: quanto mais escuro que o papel, mais opaco
      const t0 = Math.max(0.02, 0.30 - sensibilidade * 0.035);
      const t1 = t0 + 0.2;
      const alfa = new Uint8ClampedArray(n);
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const i = y * w + x;
          const f = Math.max(fundoEm(x, y), 1);
          const escuro = (f - lum[i]) / f;
          const a = Math.min(1, Math.max(0, (escuro - t0) / (t1 - t0)));
          alfa[i] = Math.round(a * 255);
        }
      }

      // Apaga manchas pequenas e soltas
      const minimo = Math.max(12, Math.round(n * 0.00004));
      const visto = new Uint8Array(n);
      const fila = new Int32Array(n);
      for (let s0 = 0; s0 < n; s0++) {
        if (!alfa[s0] || visto[s0]) continue;
        let ini = 0, fim = 0;
        fila[fim++] = s0; visto[s0] = 1;
        while (ini < fim) {
          const i = fila[ini++];
          const x = i % w, y = (i - x) / w;
          if (x > 0 && alfa[i - 1] && !visto[i - 1]) { visto[i - 1] = 1; fila[fim++] = i - 1; }
          if (x < w - 1 && alfa[i + 1] && !visto[i + 1]) { visto[i + 1] = 1; fila[fim++] = i + 1; }
          if (y > 0 && alfa[i - w] && !visto[i - w]) { visto[i - w] = 1; fila[fim++] = i - w; }
          if (y < h - 1 && alfa[i + w] && !visto[i + w]) { visto[i + w] = 1; fila[fim++] = i + w; }
        }
        if (fim < minimo) for (let k = 0; k < fim; k++) alfa[fila[k]] = 0;
      }

      // Cor: a da caneta (corrigindo o tom do papel e reforçando um pouco), ou preta
      for (let i = 0; i < n; i++) {
        const p = i * 4;
        if (tintaPreta) {
          d[p] = d[p + 1] = d[p + 2] = 26;
        } else {
          const f = Math.max(fundoEm(i % w, Math.floor(i / w)), 1);
          for (let c = 0; c < 3; c++) d[p + c] = Math.min(255, Math.max(0, (d[p + c] * 255 / f) * 0.8));
        }
        d[p + 3] = alfa[i];
      }
      cx.putImageData(im, 0, 0);
      return cv;
    }

    // Corta as sobras em branco e reduz a imagem (fica leve para salvar no navegador)
    function recortarAssinatura(pad) {
      const { width: w, height: h } = pad;
      const dados = pad.getContext("2d").getImageData(0, 0, w, h).data;
      let x0 = w, y0 = h, x1 = -1, y1 = -1;
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          if (dados[(y * w + x) * 4 + 3] > 10) {
            if (x < x0) x0 = x;
            if (x > x1) x1 = x;
            if (y < y0) y0 = y;
            if (y > y1) y1 = y;
          }
        }
      }
      if (x1 < 0) return null;
      const m = 4;
      x0 = Math.max(0, x0 - m); y0 = Math.max(0, y0 - m);
      x1 = Math.min(w - 1, x1 + m); y1 = Math.min(h - 1, y1 + m);
      const cw = x1 - x0 + 1, ch = y1 - y0 + 1;
      const escala = Math.min(1, 240 / ch);
      const saida = document.createElement("canvas");
      saida.width = Math.round(cw * escala);
      saida.height = Math.round(ch * escala);
      saida.getContext("2d").drawImage(pad, x0, y0, cw, ch, 0, 0, saida.width, saida.height);
      return { src: saida.toDataURL("image/png"), proporcao: cw / ch };
    }

    function trocarAba(aba) {
      $("app").dataset.aba = aba;
      document.querySelectorAll(".abas button").forEach((b) => {
        b.setAttribute("aria-selected", String(b.dataset.aba === aba));
      });
      if (aba === "previa") { zerarZoom(); atualizarPrevia(); } // o canvas só tem tamanho quando aparece
    }

    // ---------- Prévia e zoom ----------
    // Pinça (ou roda do mouse) amplia só a folha; arrastar move quando ampliada; toque duplo
    // amplia no ponto tocado ou volta. A folha é redesenhada a cada movimento, então não borra
    const ZOOM_MAX = 8;
    const FOLGA = 8;                          // respiro nas bordas ao arrastar ampliado
    const zoom = { s: 1, x: 0, y: 0 };        // x, y: canto da folha dentro do canvas
    const vista = { W: 0, H: 0, w: 0, h: 0, dpr: 1, papel: null, cmds: null };
    let quadro = 0, animacao = 0;

    function limitarZoom() {
      const eixo = (pos, tam, area) => tam <= area - 2 * FOLGA
        ? (area - tam) / 2
        : Math.min(FOLGA, Math.max(area - tam - FOLGA, pos));
      zoom.x = eixo(zoom.x, vista.w * zoom.s, vista.W);
      zoom.y = eixo(zoom.y, vista.h * zoom.s, vista.H);
    }

    function pintarPrevia() {
      cancelAnimationFrame(quadro);
      quadro = 0;
      if (!vista.W || !vista.H) return;       // aba escondida
      limitarZoom();
      const canvas = $("previa");
      const ctx = canvas.getContext("2d");
      const w = vista.w * zoom.s, h = vista.h * zoom.s;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.setTransform(vista.dpr, 0, 0, vista.dpr, zoom.x * vista.dpr, zoom.y * vista.dpr);
      ctx.save();
      ctx.shadowColor = "rgba(0, 0, 0, 0.12)";
      ctx.shadowBlur = 10 * vista.dpr;
      ctx.shadowOffsetY = 2 * vista.dpr;
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, w, h);
      ctx.restore();
      if (vista.cmds) desenharCanvas(ctx, vista.cmds, w / vista.papel.w);
      canvas.parentElement.classList.toggle("ampliada", zoom.s > 1);
    }

    function agendarPintura() {
      if (!quadro) quadro = requestAnimationFrame(pintarPrevia);
    }

    function zerarZoom() {
      cancelAnimationFrame(animacao);
      zoom.s = 1;
      agendarPintura();
    }

    // Amplia para "novo" mantendo parado o ponto (cx, cy) da tela
    function ampliarEm(novo, cx, cy) {
      const r = $("previa").getBoundingClientRect();
      const px = cx - r.left, py = cy - r.top;
      const lx = (px - zoom.x) / zoom.s, ly = (py - zoom.y) / zoom.s;
      zoom.s = Math.min(ZOOM_MAX, Math.max(1, novo));
      zoom.x = px - lx * zoom.s;
      zoom.y = py - ly * zoom.s;
      limitarZoom();
      agendarPintura();
    }

    // Toque duplo: transição curta em vez de salto
    function animarZoom(alvo, cx, cy) {
      cancelAnimationFrame(animacao);
      const de = zoom.s, inicio = performance.now();
      const passo = (agora) => {
        const p = Math.min(1, Math.max(0, (agora - inicio) / 220));
        ampliarEm(de + (alvo - de) * (1 - Math.pow(1 - p, 3)), cx, cy);
        if (p < 1) animacao = requestAnimationFrame(passo);
      };
      animacao = requestAnimationFrame(passo);
    }

    (function gestosDaPrevia() {
      const moldura = $("previa").parentElement;
      const dedos = new Map();
      let pinca = null, ultimoToque = { t: 0, x: 0, y: 0 }, moveu = false, partida = null;

      const centro = () => {
        const p = [...dedos.values()];
        return { x: (p[0].x + p[1].x) / 2, y: (p[0].y + p[1].y) / 2, d: Math.max(1, Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y)) };
      };

      moldura.addEventListener("pointerdown", (e) => {
        cancelAnimationFrame(animacao);
        moldura.setPointerCapture(e.pointerId);
        dedos.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (dedos.size === 1) { moveu = false; partida = { x: e.clientX, y: e.clientY }; }
        if (dedos.size === 2) { moveu = true; pinca = centro(); }
        if (zoom.s > 1) moldura.classList.add("arrastando");
      });

      moldura.addEventListener("pointermove", (e) => {
        const antes = dedos.get(e.pointerId);
        if (!antes) return;
        const agora = { x: e.clientX, y: e.clientY };
        dedos.set(e.pointerId, agora);
        // O dedo sempre treme um pouco: só conta como movimento depois de alguns pixels
        if (Math.hypot(agora.x - partida.x, agora.y - partida.y) > 8) moveu = true;
        if (dedos.size === 2 && pinca) {
          const c = centro();
          ampliarEm(zoom.s * (c.d / pinca.d), pinca.x, pinca.y);
          zoom.x += c.x - pinca.x;
          zoom.y += c.y - pinca.y;
          limitarZoom();
          pinca = c;
        } else if (dedos.size === 1 && zoom.s > 1) {
          zoom.x += agora.x - antes.x;
          zoom.y += agora.y - antes.y;
          limitarZoom();
          agendarPintura();
        }
      });

      const soltar = (e) => {
        if (!dedos.has(e.pointerId)) return;
        dedos.delete(e.pointerId);
        if (dedos.size < 2) pinca = null;
        if (dedos.size) return;
        moldura.classList.remove("arrastando");
        if (e.type !== "pointerup" || moveu) return;
        const agora = Date.now();
        if (agora - ultimoToque.t < 320 && Math.hypot(e.clientX - ultimoToque.x, e.clientY - ultimoToque.y) < 40) {
          animarZoom(zoom.s > 1 ? 1 : 3, e.clientX, e.clientY);
          ultimoToque.t = 0;
        } else {
          ultimoToque = { t: agora, x: e.clientX, y: e.clientY };
        }
      };
      moldura.addEventListener("pointerup", soltar);
      moldura.addEventListener("pointercancel", soltar);

      // Computador: roda do mouse (ou pinça no touchpad) amplia no ponto do cursor
      moldura.addEventListener("wheel", (e) => {
        e.preventDefault();
        ampliarEm(zoom.s * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)), e.clientX, e.clientY);
      }, { passive: false });

      // iPhone/iPad: o Safari ignora o bloqueio de zoom do viewport; os gestos nativos são barrados aqui
      ["gesturestart", "gesturechange"].forEach((ev) => document.addEventListener(ev, (e) => e.preventDefault()));
    })();

    // ---------- Puxar para atualizar ----------
    (function puxarParaAtualizar() {
      const aviso = $("puxar");
      const MINIMO = 110;                     // quanto arrastar para valer
      let inicio = null;

      const esconder = () => {
        inicio = null;
        aviso.style.opacity = "";
        aviso.style.transform = "";
        aviso.classList.remove("pronto");
      };

      document.addEventListener("touchstart", (e) => {
        esconder();
        const alvo = e.target;
        if (e.touches.length !== 1 || document.querySelector("dialog[open]")) return;
        if (!alvo.closest || alvo.closest("input, select, textarea")) return;
        // Nas configurações, só vale com a lista já no topo; na prévia, só sem zoom
        const lista = alvo.closest(".config");
        if (lista && lista.scrollTop > 0) return;
        if (zoom.s > 1 && alvo.closest(".previa-moldura")) return;
        inicio = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }, { passive: true });

      document.addEventListener("touchmove", (e) => {
        if (!inicio) return;
        if (e.touches.length !== 1) { esconder(); return; }
        const dx = e.touches[0].clientX - inicio.x;
        const dy = e.touches[0].clientY - inicio.y;
        if (dy < 12 || Math.abs(dx) > dy) {
          aviso.style.opacity = "";
          aviso.classList.remove("pronto");
          return;
        }
        const p = Math.min(1, dy / MINIMO);
        aviso.style.opacity = String(p);
        aviso.style.transform = "translateY(" + (-50 + p * 62) + "px) rotate(" + (p * 270) + "deg)";
        aviso.classList.toggle("pronto", dy >= MINIMO);
      }, { passive: true });

      document.addEventListener("touchend", () => {
        if (!inicio || !aviso.classList.contains("pronto")) { esconder(); return; }
        inicio = null;
        aviso.style.transform = "translateY(12px)";
        aviso.classList.add("girando");
        try { sessionStorage.setItem("mm-aba", $("app").dataset.aba); } catch (e) { /* ignora */ }
        location.reload();
      });
      document.addEventListener("touchcancel", esconder);
    })();

    // ---------- Altura do app (celular) ----------
    function ajustarAltura() {
      const medidas = [window.innerHeight, document.documentElement.clientHeight];
      // Com o teclado aberto a área visível encolhe; aí ela não conta
      const digitando = document.activeElement && document.activeElement.matches("input, textarea, select");
      if (window.visualViewport && !digitando) medidas.push(Math.round(window.visualViewport.height));
      const validas = medidas.filter((n) => n > 0);
      if (validas.length) document.documentElement.style.setProperty("--altura-app", Math.min(...validas) + "px");
    }
    ajustarAltura();
    ["resize", "orientationchange", "pageshow"].forEach((ev) => window.addEventListener(ev, ajustarAltura));

    // ---------- Eventos ----------
    document.querySelectorAll(".abas button").forEach((b) => {
      b.addEventListener("click", () => trocarAba(b.dataset.aba));
    });

    document.querySelectorAll(".config input, .config select").forEach((el) => {
      const atualiza = () => { salvarConfig(); atualizarPrevia(); };
      el.addEventListener("input", atualiza);
      el.addEventListener("change", atualiza);
    });

    $("idioma").addEventListener("change", (e) => {
      const anterior = idioma;
      idioma = e.target.value;
      traduzirTextosPadrao(anterior, idioma);
      aplicarTextos();
      salvarConfig();
      atualizarPrevia();
      // O endereço passa a ser o do idioma (/xx/): quem receber o link já abre no mesmo idioma
      try {
        history.replaceState(null, "", new URL(idioma + "/", RAIZ));
      } catch (erro) { /* endereço que não aceita mudança: segue sem */ }
    });

    // O seletor de idioma fica no cabeçalho do celular ou no topo do painel (tablet e desktop)
    const telaLarga = window.matchMedia("(min-width: 768px)");
    function posicionarIdioma() {
      const destino = $(telaLarga.matches ? "lugar-idioma-painel" : "lugar-idioma-celular");
      const seletor = $("escolha-idioma");
      if (seletor.parentElement !== destino) destino.append(seletor);
    }
    telaLarga.addEventListener("change", posicionarIdioma);

    $("botao").addEventListener("click", baixarPDF);

    // Novo texto entra no fim da área escolhida, já com o campo pronto para digitar
    document.querySelectorAll(".btn-add").forEach((bt) => {
      bt.addEventListener("click", () => {
        const b = { tipo: "livre", ativo: true, valor: "", pos: `${bt.dataset.zona}-centro`, tam: "m" };
        textos.push(b);
        renderTextos(b);
        mudouTextos();
        const campo = document.querySelector(`[data-foco="${idDe(b)}-texto"]`);
        if (campo) campo.focus();
      });
    });

    // ---------- Apoio (café e sugestões) ----------
    function aplicarTextosApoio(t) {
      const temCafe = Boolean(APOIO.pix || APOIO.kofi);
      $("btn-cafe").hidden = !temCafe;
      $("link-sugestoes").hidden = !APOIO.sugestoes;
      $("apoio").hidden = !temCafe && !APOIO.sugestoes;
      $("btn-cafe").textContent = t.cafe;
      $("link-sugestoes").textContent = t.sugestoes;
      if (APOIO.sugestoes) $("link-sugestoes").href = APOIO.sugestoes;
      $("cafe-titulo").textContent = t.cafeTitulo;
      $("cafe-dica").textContent = t.cafeDica;
      $("cafe-pix").hidden = !APOIO.pix;
      $("cafe-pix-titulo").textContent = t.pixTitulo;
      $("cafe-pix-dica").textContent = t.pixDica;
      $("cafe-chave").textContent = APOIO.pix;
      $("cafe-copiar").textContent = t.copiar;
      $("cafe-kofi").hidden = !APOIO.kofi;
      $("cafe-kofi-titulo").textContent = t.kofiTitulo;
      $("cafe-kofi-dica").textContent = t.kofiDica;
      $("cafe-kofi-link").textContent = t.kofiAbrir;
      if (APOIO.kofi) $("cafe-kofi-link").href = APOIO.kofi;
      $("cafe-fechar").textContent = t.fechar;
      // Fora do Brasil o Ko-fi vem primeiro (Pix só funciona com conta brasileira)
      const dlg = $("dlg-cafe");
      if (idioma === "pt") dlg.insertBefore($("cafe-pix"), $("cafe-kofi"));
      else dlg.insertBefore($("cafe-kofi"), $("cafe-pix"));
    }

    $("btn-cafe").addEventListener("click", () => $("dlg-cafe").showModal());
    $("cafe-fechar").addEventListener("click", () => $("dlg-cafe").close());
    $("cafe-copiar").addEventListener("click", async () => {
      const t = TEXTOS[idioma];
      const bt = $("cafe-copiar");
      try {
        await navigator.clipboard.writeText(APOIO.pix);
      } catch (e) {
        // Sem acesso à área de transferência: seleciona a chave para a pessoa copiar
        const r = document.createRange();
        r.selectNodeContents($("cafe-chave"));
        const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
        return;
      }
      bt.textContent = t.copiado;
      setTimeout(() => { bt.textContent = TEXTOS[idioma].copiar; }, 2000);
    });

    // Volta tudo ao padrão, menos a data de nascimento (o resto é preferência; a data é um dado da pessoa)
    $("restaurar").addEventListener("click", () => {
      if (!confirm(TEXTOS[idioma].confirmarRestaurar)) return;
      // Mantém a data de nascimento e o idioma; todo o resto volta ao padrão
      const nascimento = $("nascimento").value;
      try {
        localStorage.setItem(CHAVE_CONFIG, JSON.stringify(nascimento ? { nascimento, idioma } : { idioma }));
      } catch (e) { /* ignora */ }
      location.reload();
    });

    let redimensionando;
    window.addEventListener("resize", () => {
      clearTimeout(redimensionando);
      redimensionando = setTimeout(() => { ajustarAltura(); zerarZoom(); atualizarPrevia(); }, 120);
    });

    // ---------- Inicialização ----------
    // Calendário nativo do sistema, limitado a 1900 até hoje (o seletor já bloqueia o resto)
    (function limitarData() {
      const h = new Date();
      const p = (n) => String(n).padStart(2, "0");
      $("nascimento").min = ANO_MIN + "-01-01";
      $("nascimento").max = `${h.getFullYear()}-${p(h.getMonth() + 1)}-${p(h.getDate())}`;
    })();
    preencherSelects();
    $("papel-" + papelPadrao()).checked = true; // A4 ou Carta conforme o país (a configuração salva vale mais)
    aplicarTextos();   // monta a lista de frases
    carregarConfig();  // restaura a configuração salva
    aplicarTextos();   // aplica o idioma e mantém a frase escolhida
    posicionarIdioma();
    // Depois de puxar para atualizar, volta para a aba em que a pessoa estava
    let abaInicial = "config";
    try {
      if (sessionStorage.getItem("mm-aba") === "previa") abaInicial = "previa";
      sessionStorage.removeItem("mm-aba");
    } catch (e) { /* ignora */ }
    trocarAba(abaInicial);
    atualizarPrevia();

    // App instalado (Tela de Início): funciona sem internet depois da primeira visita
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("../sw.js").catch(() => { /* sem modo offline */ });
      });
    }
  </script>
</body>
